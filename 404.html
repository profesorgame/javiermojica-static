  :root { --cream: #fdfbf2; --navy: #051657; --cyan: #75ddeb; --yellow: #fffb75; --lilac: #6c6bff; --pink: #da4dcd; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid; align-items: center; overflow: hidden;
    background: var(--cream); color: var(--navy);
    font-family: "Cabinet Grotesk", ui-sans-serif, system-ui, sans-serif;
  }
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center;
    gap: clamp(1.5rem, 5vw, 5rem); width: min(100% - 3rem, 72rem); margin-inline: auto;
  }
  h1 { font-weight: 700; font-size: clamp(6rem, 20vw, 15rem); line-height: .85; letter-spacing: -.045em; }
  p { margin-top: clamp(.75rem, 2vw, 1.5rem); font-size: clamp(1.125rem, 1.6vw, 1.5rem); }
  /* the Equipo Ola gesture: a thick neon underline under the key words */
  p span { text-decoration: underline; text-decoration-color: #da4dcd; text-decoration-thickness: .14em; text-underline-offset: .18em; text-decoration-skip-ink: none; }
  /* a small brain in the palette: flat fill plus an off-register navy pen line */
  svg { width: 100%; max-width: 22rem; justify-self: center; overflow: visible; }
  /* on hover with a mouse: the brain leans toward the cursor, the dots drift away */
  .brain, .dot { transform-box: fill-box; transform-origin: center; transition: transform .7s cubic-bezier(.16, 1, .3, 1); }
  /* ambient float: the brain drifts and sways; the dots float the opposite way */
  .brain { animation: float 6s ease-in-out infinite alternate; }
  .dot { animation: float-dot 6s ease-in-out infinite alternate-reverse; }
  .dot + .dot { animation-duration: 7.5s; }
  @keyframes float { from { translate: 0 -5px; rotate: -2deg; } to { translate: 0 5px; rotate: 2deg; } }
  @keyframes float-dot { from { translate: 0 -6px; } to { translate: 0 6px; } }
  @media (prefers-reduced-motion: reduce) { .brain, .dot { transition: none; animation: none; } }
  /* phones: one centred stack, brain on top */
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: clamp(1rem, 4vh, 2.5rem); }
    svg { order: -1; width: min(68vw, 17rem); max-width: none; justify-self: center; }
    h1 { font-size: clamp(5.5rem, 34vw, 10rem); }
  }

<script>
  (function () {
    if (!matchMedia("(pointer: fine)").matches || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var brain = document.querySelector(".brain"), dots = document.querySelectorAll(".dot"), x = 0, y = 0, q = false;
    function frame() {
      q = false;
      var r = brain.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var dx = x - cx, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy) || 1, k = Math.max(0, 1 - d / 600);
      brain.style.transform = "translate(" + (dx / d * 6 * k).toFixed(1) + "px," + (dy / d * 6 * k).toFixed(1) + "px) rotate(" + (dx / d * 5 * k).toFixed(1) + "deg)";
      dots.forEach(function (o) {
        var b = o.getBoundingClientRect(), ex = b.left + b.width / 2 - x, ey = b.top + b.height / 2 - y;
        var e = Math.sqrt(ex * ex + ey * ey) || 1, p = Math.max(0, 1 - e / 300) * 14;
        o.style.transform = "translate(" + (ex / e * p).toFixed(1) + "px," + (ey / e * p).toFixed(1) + "px)";
      });
    }
    addEventListener("pointermove", function (e) { x = e.clientX; y = e.clientY; if (!q) { q = true; requestAnimationFrame(frame); } }, { passive: true });
    document.documentElement.addEventListener("pointerleave", function () { brain.style.transform = ""; dots.forEach(function (o) { o.style.transform = ""; }); });
  })();
</script>
